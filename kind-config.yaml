kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-net-lab

# kindnet does NOT enforce NetworkPolicy. We disable it and install Cilium
# in bootstrap.sh so Module 2 can teach real policy enforcement.
networking:
  disableDefaultCNI: true
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/16"

nodes:
  - role: control-plane
    extraPortMappings:
      # Envoy Gateway / Ingress HTTP
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # Envoy Gateway / Ingress HTTPS
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
      # Generic NodePort range used by lessons
      - containerPort: 30081
        hostPort: 30081
        protocol: TCP
  - role: worker
  - role: worker
