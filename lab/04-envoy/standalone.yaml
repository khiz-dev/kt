apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-standalone-config
  namespace: net-lab
data:
  envoy.yaml: |
    admin:
      address:
        socket_address: { address: 0.0.0.0, port_value: 9901 }
    static_resources:
      listeners:
        - name: listener_http
          address:
            socket_address: { address: 0.0.0.0, port_value: 8080 }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    route_config:
                      name: local_route
                      virtual_hosts:
                        - name: lab
                          domains: ["*"]
                          include_attempt_count_in_response: true
                          routes:
                            - match: { prefix: "/api" }
                              route:
                                cluster: "api"
                                retry_policy:
                                  retry_on: "5xx"
                                  num_retries: 2
                            - match: { prefix: "/" }
                              route: { cluster: "web" }
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: api
          type: STRICT_DNS
          connect_timeout: 5s
          load_assignment:
            cluster_name: api
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: api.net-lab.svc.cluster.local
                          port_value: 80
        - name: web
          type: STRICT_DNS
          connect_timeout: 5s
          load_assignment:
            cluster_name: web
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: web.net-lab.svc.cluster.local
                          port_value: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy-standalone
  namespace: net-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy-standalone
  template:
    metadata:
      labels:
        app: envoy-standalone
    spec:
      containers:
        - name: envoy
          image: envoyproxy/envoy:v1.34-latest
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
          ports:
            - containerPort: 8080
            - containerPort: 9901
          volumeMounts:
            - name: config
              mountPath: /etc/envoy
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - name: config
          configMap:
            name: envoy-standalone-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-standalone
  namespace: net-lab
spec:
  selector:
    app: envoy-standalone
  ports:
    - name: http
      port: 8080
      targetPort: 8080
