apiVersion: v1
kind: Namespace
metadata:
  name: other
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cross
  namespace: other
spec:
  parentRefs:
    - name: eg
      namespace: net-lab
  hostnames:
    - other.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web
          namespace: net-lab
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-other-to-web
  namespace: net-lab
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: other
  to:
    - group: ""
      kind: Service
