apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: demo
  namespace: canary
spec:
  hosts:
    - demo
    - demo.canary.svc.cluster.local
  http:
    - match:
        - headers:
            x-canary:
              exact: "true"
      route:
        - destination:
            host: demo
            subset: v2
    - route:
        - destination:
            host: demo
            subset: v1
          weight: 90
        - destination:
            host: demo
            subset: v2
          weight: 10
